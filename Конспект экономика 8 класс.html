# Конспект по разделу «Экономика» (8 класс) — Термины + Пояснения

## Тема: Что такое экономика?

**Экономика** — это двойное понятие.

**Экономика как хозяйство** — это система хозяйствования, обеспечивающая общество материальными и нематериальными благами. Она включает четыре стадии: **производство** (создание продукта), **распределение** (определение доли каждого), **обмен** (купля-продажа) и **потребление** (использование продукта).

**Экономика как наука** — это область знаний, изучающая, как в условиях **ограниченности ресурсов** удовлетворить **постоянно растущие потребности людей**.

> **Пояснение:** У вас есть 1000 рублей карманных денег (ресурс ограничен), а хочется купить и игру, и вкусняшки, и сходить в кино (потребности растут). Экономика — это наука о том, как сделать выбор в такой ситуации. На уровне страны то же самое: ресурсов (нефти, газа, времени, денег) всегда меньше, чем желаний.

### Три главных вопроса экономики:

1. **Что производить?** На этот вопрос отвечает **спрос** (то, что готовы купить люди). Но из-за ограниченности ресурсов общество вынуждено выбирать, что для него важнее: построить больницу или купить новые танки.

2. **Как производить?** На этот вопрос отвечает **экономическая эффективность** — соотношение между результатом производства и затратами на него. Нужно найти самую выгодную технологию. Также важна **эффективность распределения ресурсов** — как использовать ограниченные ресурсы, чтобы получить максимальную пользу. Для этого используют **правило сравнительного преимущества**: производить то, что у тебя получается дешевле, чем у конкурентов.

   > **Пояснение:** Вы хотите испечь пирожки. Можно месить тесто руками (долго и дорого, если считать время), а можно купить тестомес (затраты большие сейчас, но потом быстрее и дешевле). Эффективность — это выбор лучшего способа.

3. **Для кого производить?** На этот вопрос отвечает **денежный принцип** — кто больше заплатит, тот и получит товар.

   > **Пояснение:** Билеты на концерт популярной группы достанутся тем, кто готов заплатить больше. Это и есть денежный принцип.

## Тема: Типы экономических систем

**Экономическая система** — это способ согласования экономической деятельности, который решает проблему ограниченности ресурсов. Существует три варианта решения экономических вопросов: с помощью традиций, с помощью приказов власти, с помощью рынка.

### А. Традиционная экономическая система

**Определение:** система, в которой использование ограниченных ресурсов определяется **традициями и обычаями**.

**Характеристики:** основана на ручном труде и сельском хозяйстве. Собственность обычно принадлежит общине (родовой или соседской). Государство почти не участвует в экономике.

**Вопросы экономики:** что производить — решают обычаи (как делали предки); как производить — так же, как всегда; для кого — по правилам общины.

**Примеры стран:** Буркина-Фасо, Бурунди, Бангладеш, Афганистан, Бенин.

> **Пояснение:** Если дед был кузнецом, сын и внук тоже кузнецы. Ты не выбираешь профессию — она передается по наследству. В таких странах люди живут так же, как их предки сотни лет назад.

### Б. Рыночная экономическая система

**Определение:** система, основанная на **многообразии форм собственности, предпринимательстве, конкуренции и свободных ценах**.

**Характеристики:** преобладает частная собственность и конкурентный рынок. Государство не вмешивается в экономику, а лишь контролирует ее на правовом уровне (следит за соблюдением законов).

**Вопросы экономики:** что производить — решают спрос и предложение; как производить — выбирает сам производитель, исходя из эффективности; для кого — тот, кто может заплатить.

**Примеры стран:** США, Швейцария, Сингапур, Канада.

> **Пояснение:** Если все хотят айфоны, компании будут производить айфоны и соревноваться, кто сделает лучше и дешевле. Государство не говорит бизнесу, что делать, а только следит, чтобы никто не обманывал покупателей.

### В. Командная (плановая) экономическая система

**Определение:** система, в которой экономические решения принимаются государством.

**Характеристики:** вся собственность и производство находятся в руках власти. Что производить — определяется **государственным планом**.

**Примеры:** СССР, Северная Корея (КНДР).

> **Пояснение:** Государство говорит: "Все заводы будут делать только такие холодильники, и стоить они будут столько-то". Нет конкуренции, поэтому часто нет и хорошего качества. Если холодильник сломался, нового может не быть — потому что план уже выполнен.

### Г. Смешанная экономическая система

**Определение:** система, в которой и **рынок**, и **государство** имеют существенное влияние.

**Характеристики:** собственность может быть как частной, так и государственной. На вопрос "что производить" отвечает закон спроса и предложения, но он контролируется государством. Государство участвует в экономике на высоком уровне.

**Примеры стран:** Россия, Китай, Швеция, Япония.

> **Пояснение:** Это самый распространенный тип. Бизнес работает свободно (рынок), но там, где бизнесу невыгодно (дороги, школы, помощь бедным, оборона), в дело вступает государство.

## Тема: Рынок и рыночный механизм

**Рынок в широком смысле** — это форма организации производства и экономических отношений, связанных с куплей, продажей и производством товара. На рынке взаимодействуют **покупатель** (формирует спрос) и **продавец** (формирует предложение).

Рынок основан на:

- **частной собственности** (человек владеет тем, что производит);
- **предпринимательстве** (люди открывают свой бизнес);
- **конкуренции** (соперничество);
- **всеобъемных ценах** (цены определяются спросом и предложением, а не государством);
- **законе спроса и предложения**.

Взаимодействие основных элементов рынка называют **рыночным механизмом**.

**Конкуренция** — это соперничество между участниками рынка за лучшие условия производства, купли и продажи товара.

> **Пояснение:** Конкуренция заставляет производителей снижать цены и повышать качество. Если один продавец задирает цену, покупатели уйдут к другому. Если товар плохой, все пойдут туда, где качество лучше.

**Спрос** — это желание потребителя и его возможность приобрести товар или услугу.

> **Пояснение:** Хотеть "Мерседес" — это желание. Иметь деньги на "Мерседес" — это возможность. Только когда есть и то и другое, возникает спрос.

**Предложение** — это желание производителя и его возможность произвести и продать товар.

> **Пояснение:** Хотеть продать 1000 пирожков — это желание. Иметь муку, печь и время, чтобы их испечь — это возможность.

### Закон спроса и предложения:

- **Чем выше цена, тем ниже спрос** (покупатели отказываются от дорогого товара) и **выше предложение** (продавцам выгодно продавать дорого).
- **Чем ниже цена, тем выше спрос** (покупатели скупают дешевый товар) и **ниже предложение** (продавцам невыгодно продавать дешево). Возникает **дефицит** — товара не хватает на всех.

> **Пояснение:** Если помидоры стоят 1000 руб. за кг, их почти никто не купит (спрос низкий), зато фермеры повезут их тоннами (предложение высокое). Если помидоры стоят 10 руб. за кг, все будут их скупать (спрос высокий), но фермерам невыгодно их везти (предложение низкое), и в магазинах их не будет — дефицит.

**Факторы, влияющие на спрос:**

- Личный доход (чем больше денег, тем больше спрос).
- Потребности (желания).
- Цена на товар и цена на товар-аналог (если подорожали апельсины, могут начать покупать мандарины).
- Мода (сегодня хотят одно, завтра — другое).
- Сезонность (зимой спрос на зимнюю одежду выше).

**Равновесная цена** — это цена, при которой спрос и предложение примерно равны. В этой точке продавцы продают всё, что привезли, а покупатели покупают всё, что хотели.

> **Пояснение:** Это "золотая середина", когда все довольны: продавец не везет остатки обратно на склад, а покупатель не стоит в очереди за дефицитным товаром.

## Тема: Факторы производства и экономическая деятельность

**Факторы производства** — это ресурсы, которые используются в экономике для создания товаров и услуг. Предприятия закупают факторы производства при открытии бизнеса, и эти затраты называются издержками.

К факторам производства относятся:

1. **Земля** — все природные ресурсы: земля как территория, вода, лес, полезные ископаемые, нефть, газ.
   > **Пояснение:** Это не только поле или участок под строительство. Нефтяная вышка добывает нефть — это использование фактора "земля".

2. **Труд** — умственные и физические усилия людей, их профессии, квалификация, знания, опыт.
   > **Пояснение:** Врач лечит, учитель учит, строитель строит — все они используют свой труд. Чем выше квалификация, тем ценнее труд.

3. **Капитал** — средства производства, созданные людьми: здания, станки, оборудование, транспорт, инструменты. А также денежные средства, на которые это покупается.
   > **Пояснение:** Не путайте с деньгами в кармане! В экономике капитал — это то, что помогает производить другие вещи. Завод, грузовик, компьютер — это капитал.

4. **Информация** — знания, технологии, научные разработки, ноу-хау, рецепты.
   > **Пояснение:** Если у вас есть формула "Кока-Колы" или технология производства современных микросхем, вы можете заработать миллиарды. Информация — это важнейший ресурс в современном мире.

5. **Предпринимательские способности** — умение организовать бизнес, рассчитать риски, принять решение, соединить все факторы производства так, чтобы получить прибыль.
   > **Пояснение:** Не каждый хороший пекарь может открыть свою пекарню. Нужно уметь нанять людей, взять кредит, найти помещение, рассчитать цены — это и есть предпринимательские способности.

**Экономическая деятельность** — это деятельность субъектов экономики (людей, фирм, государства) по производству товаров и услуг и удовлетворению потребностей.

**Виды экономической деятельности:**

- **Производство** — создание товаров и услуг.
- **Распределение** — определение доли каждого участника, доставка товара (развезли хлеб в магазины, выплатили зарплату пекарям).
- **Обмен** — купля-продажа (вы отдали деньги, вам дали хлеб).
- **Потребление** — использование товара или услуги (вы съели хлеб).

**Экономический продукт** — это результат экономической деятельности, который удовлетворяет потребности.

**Виды экономического продукта:**

- **Товар** — материальный продукт, вещь (хлеб, телефон, машина).
- **Услуга** — действие, которое удовлетворяет потребности (стрижка, ремонт, перевозка, консультация врача).

> **Пояснение:** Когда вы покупаете телефон — это товар. Когда вы платите за стрижку — это услуга. Услугу нельзя потрогать, но она имеет ценность.

## Тема: Предпринимательство и фирма

**Предпринимательство** — это самостоятельная, инициативная, рисковая деятельность людей, направленная на получение прибыли.

> **Пояснение:** Предприниматель не работает "на дядю". Он сам решает, что делать, сам вкладывает свои деньги (или берет в долг) и сам отвечает за результат. Если бизнес прогорит, он потеряет свои деньги. Это и есть риск.

**Функции предпринимательства:**

- Финансирование отраслей экономики (предприниматели вкладывают деньги в развитие производства).
- Обеспечение занятости (предприниматели нанимают работников).
- Увеличение государственного бюджета за счет налогов (предприниматели платят налоги).

**Фирма (предприятие)** — это объединение, которое получает прибыль посредством обеспечения потребителя продукцией.

**Капитал фирмы** делится на два типа:

- **Собственный капитал** — деньги, которые принадлежат фирме после погашения всех долгов. Его можно увеличить за счет выпуска и продажи **акций**. Эти средства обычно не подлежат возврату.
- **Заемный капитал** — деньги, которые фирма берет в пользование на фиксированный срок (от нескольких дней до десятков лет) за установленную плату — **проценты**.

> **Пояснение:** Если вы открываете бизнес на свои сбережения — это собственный капитал. Если берете кредит в банке — это заемный капитал. За пользование кредитом нужно платить проценты сверх суммы долга.

**Причины закрытия фирмы:**

- **Ликвидация** — собственники сами принимают решение закрыть предприятие.
- **Банкротство** — юридическая процедура, когда фирма не может расплатиться с долгами.

> **Пояснение:** Банкротство — это не просто "кончились деньги". Это официальное признание того, что фирма не может отдать долги. Ее имущество распродают, чтобы рассчитаться с кредиторами.

Причины неэффективности фирмы могут быть связаны с общей экономической ситуацией в стране (кризис, высокая инфляция) или с личными качествами владельцев (неспособность вести дела, отсутствие профессиональных знаний, управленческого опыта).

**Как работает фирма:**

1. Предприниматель приобретает факторы производства (сырье, ресурсы, труд) — это издержки (затраты).
2. Производит товары или услуги.
3. Продает их и получает выручку.
4. **Прибыль = Выручка — Издержки.**

> **Пояснение:** Вы купили муку, яйца, сахар, заплатили пекарю за работу, заплатили за электричество — это издержки (допустим, 500 руб.). Испекли пирожки и продали их за 800 руб. Прибыль = 300 руб. Если издержки больше выручки — вы работаете в убыток.

Для увеличения спроса предприниматель стремится улучшить качество товара, расширить ассортимент, снизить цены.

### Формы предприятий:

- **ИП (индивидуальный предприниматель)** — один собственник, несет полную ответственность за имущество. Он самостоятельно решает, что, как и для кого производить, единолично распоряжается прибылью.
  > **Пояснение:** Если ИП задолжал, кредиторы могут забрать его личное имущество — квартиру, машину. Это самый рискованный вариант.

- **Товарищество** — объединение двух и более лиц для совместного ведения дел. Каждый участник вносит вклад (долю) в уставной капитал. Права и ответственность распределяются пропорционально доле.
  > **Пояснение:** Два друга решили открыть бизнес. Один вложил 70% денег, другой — 30%. Прибыль они делят в той же пропорции, и по долгам отвечают так же.

- **ООО (общество с ограниченной ответственностью)** — участники определяют доли в уставном фонде. От товарищества отличается тем, что у ООО есть органы управления (совет директоров). Участники рискуют только своей долей.
  > **Пояснение:** Если ООО банкротится, участники теряют только то, что вложили в бизнес. Их личные квартиры и машины остаются при них. Это самая популярная форма в России.

- **Акционерное общество** — организация, созданная на основе объединения денежных средств посредством продажи **акций**. **Акция** — это ценная бумага, свидетельствующая о вложении в акционерное общество и подтверждающая право на получение части его прибыли (дивидендов).
  > **Пояснение:** Купить акцию — значит дать компании деньги и стать ее совладельцем. Если компания заработала, вы получаете часть прибыли. Если разорилась — теряете деньги, потраченные на акции.

### Малые, средние и крупные предприятия

**Малое предприятие** — организация или ИП, соответствующие критериям государства. В РФ на 2020 год это: средняя численность работников 16–100 человек; доходы за год не превышают 800 млн руб.; доля участия других организаций в уставном капитале не должна быть слишком большой.

**Льготы для малого бизнеса:** финансовая поддержка, налоговые послабления.

> **Пояснение:** Государство поддерживает малый бизнес, потому что он создает рабочие места, быстро реагирует на изменения рынка и платит налоги.

## Тема: Деньги и торговля

**Деньги** — это универсальный товар-эквивалент, который служит мерой стоимости других товаров.

**Бартер** — это безденежный обмен (товар меняют на товар).

> **Пояснение:** У вас есть курица, а вам нужен топор. Вы ищете того, у кого есть топор и кому нужна курица. Это сложно. А если топор стоит дороже курицы? Как делить? Бартер неудобен, поэтому люди придумали деньги.

**Виды денег:**

- **Наличные** — монеты и купюры.
- **Безналичные** — электронные деньги, криптовалюта, банковские карты.

> **Пояснение:** Когда вам приходит зарплата на карту — это безналичные деньги. Когда вы снимаете их в банкомате — получаете наличные.

### Функции денег:

- **Мера стоимости** — устанавливает цену товара (сколько рублей стоит хлеб).
- **Средство обращения** — участвует в покупке и продаже (вы даете продавцу деньги, он дает вам товар).
- **Средство платежа** — используется для оплаты штрафов, кредитов, налогов (здесь товара может и не быть).
- **Средство накопления** — позволяет откладывать деньги, формировать бюджет.
- **Средство инвестирования** — позволяет вкладывать средства в различные активы (акции, облигации, недвижимость).

**Цена** — это выражение стоимости товара или услуги в денежной форме.

**Виды торговли:**

- **По количеству:** **оптовая** (большими партиями) и **розничная** (поштучно или мелкими партиями).
- **Формы розничной торговли:**
  - **Стационарная** — магазины, супермаркеты, торговые центры.
  - **Нестационарная** — киоски, ларьки, ярмарки.
  - **Дистанционная** — интернет-магазины, маркетплейсы (Ozon, Wildberries), телемаркетинг.

> **Пояснение:** Когда вы покупаете одну бутылку воды в ларьке — это розничная торговля. Когда магазин закупает 1000 бутылок воды у производителя — это оптовая торговля.

## Тема: Маркетинг и разделение труда

**Разделение труда** — это выделение в процессе производства отдельных операций, этапов, которые выполняются работниками определенной квалификации.

> **Пояснение:** В древности один кузнец делал весь плуг от начала до конца. Сегодня на заводе один рабочий ставит колесо, другой красит, третий проверяет электрику. Каждый делает одно и то же и становится в этом мастером.

**Разделение труда позволяет повысить производительность труда** — количество продукции, произведенной за единицу времени. Каждый работник, выполняя определенную операцию и совершенствуя свои умения, делает это точнее и быстрее.

> **Пояснение:** Если вы будете делать 100 разных операций в час, вы будете медленным. Если вы будете делать одну операцию 100 раз в час, вы станете в ней профессионалом и будете работать быстро и качественно.

В современном мире существуют тысячи профессий, многие из которых требуют специального обучения и постоянного повышения квалификации.

**Маркетинг** — это совокупность методов выбора и продвижения товаров и услуг, при продаже которых фирма может заработать наибольшую прибыль.

**Задачи маркетологов:**

- Оценивают позицию фирмы на рынке и запросы рынка.
- Исследуют процесс производства, чтобы выявить возможности снизить издержки.
- Думают о том, как создать продукцию, обладающую конкурентными преимуществами.

> **Пояснение:** Маркетолог — это не тот, кто "продает рекламу". Это человек, который отвечает на вопрос: "Что и кому мы будем продавать?" Он изучает, чего хотят люди, сколько они готовы платить, как сделать товар лучше конкурентов.

Главная задача маркетолога — правильно оценить запросы рынка и построить, исходя из этого, производственный процесс и ценовую политику фирмы. Иначе есть риск вложить средства в производство никому не нужной продукции.

> **Пояснение:** Если маркетолог ошибется и решит, что всем нужны зеленые телефоны с квадратным экраном, а людям на самом деле нужны черные с круглым, компания потратит миллионы на производство того, что никто не купит.

## Тема: Заработная плата

**Заработная плата** — это оплата трудовых услуг, предоставляемых наемным работником.

> **Пояснение:** Когда вы работаете по найму (а не на себя), работодатель платит вам зарплату.

**Формы заработной платы:**

- **Оклад** — установленный ежемесячный размер оплаты труда, который существенно не меняется от месяца к месяцу и может корректироваться с учетом отработанного времени.
  > **Пояснение:** Вы получаете 40 000 руб. каждый месяц, независимо от того, сколько продукции сделали (главное — отработали положенное время).

- **Сдельная заработная плата** — определяется объемом продукции, произведенной работником.
  > **Пояснение:** Вы получили 50 руб. за каждый собранный стул. Собрали 100 стульев — получили 5000 руб. Собрали 200 — получили 10 000 руб.

- **Премии** — дополнительные выплаты по итогам месяца, квартала или года (прибавляются к окладу или сдельной оплате).
  > **Пояснение:** Вы хорошо поработали в этом месяце — вам дали премию 10 000 руб. сверх оклада.

**Устойчивые различия в оплате труда** связаны с квалификацией работников, сложностью труда, условиями работы, спросом на профессию.

> **Пояснение:** Врач-хирург получает больше санитарки, потому что его труд требует многолетнего обучения, высокой ответственности и сложных навыков. Программист в IT-компании может получать больше, чем кассир в магазине, потому что его профессия сейчас более востребована.

## Тема: Финансовый рынок

**Финансовый рынок** — это особый рынок, на котором продаются и покупаются валюты, ценные бумаги и драгоценные металлы.

> **Пояснение:** Если на обычном рынке торгуют яблоками и телефонами, то на финансовом рынке торгуют деньгами, долгами и частями компаний.

На финансовом рынке есть **покупатели (инвесторы)** и **продавцы (кредиторы, эмитенты, продавцы валют и драгоценных металлов).**

**Эмитент** — это предприятие, выпускающее ценные бумаги с целью привлечения финансовых средств.

> **Пояснение:** Компания выпускает акции или облигации, чтобы получить деньги от инвесторов. Компания здесь — эмитент, а люди, которые покупают — инвесторы.

**Ценные бумаги** делятся на **долговые и долевые.**

**К долговым** относятся векселя и облигации:

- **Облигация** — ценная бумага, которая говорит, что ее владелец (физическое лицо) дал в долг эмитенту (юридическому лицу): государству или компании. Эмитенты выпускают облигации, физическое лицо их покупает и тем самым дает в долг юридическому лицу.
  > **Пояснение:** Вы купили облигацию компании "Газпром" за 1000 руб. Это значит, вы дали "Газпрому" в долг 1000 руб. Через год (или другой срок) компания вернет вам 1000 руб. и доплатит сверху проценты (например, 100 руб.). Это надежный, но не самый доходный способ вложений.

- **Вексель** — ценная бумага, которая говорит, что одна сторона дала в долг другой, и должник обязан вернуть долг с процентами. Векселя могут выпускать даже физические лица.
  > **Пояснение:** Вы заняли другу 10 000 руб., а он написал расписку — это простейший вексель. В отличие от облигации, вексель может выпустить любой человек, а не только компания.

**К долевым** относятся акции:

- **Акция** — ценная бумага, подтверждающая, что ее владелец вложился в капитал компании, является ее собственником и имеет право на получение части ее прибыли (дивидендов).
  > **Пояснение:** Купив акцию, вы становитесь совладельцем компании. Если компания зарабатывает, вы получаете часть прибыли. Если компания разоряется, вы теряете свои деньги. Это более рискованный, но потенциально более доходный способ вложений, чем облигации.

**Финансовые посредники** — организации, которые собирают денежные средства и передают их инвесторам или заемщикам.

1. **Банки.** Принимают вклады под определенный процент у одних граждан, другим выдают кредиты под более высокие проценты. Разница составляет прибыль банка.
   > **Пояснение:** Вы положили 1000 руб. в банк под 8% годовых. Банк выдал эти деньги другому клиенту в кредит под 18% годовых. Банк заработал на разнице в 10%.

2. **Паевые инвестиционные фонды (ПИФы).** Продают паи (доли) в фонде. Если вы вложились в пай, фонд самостоятельно вкладывает ваши деньги в различные ценные бумаги (например, акции). Вкладываться в ПИФ — рискованно, но профессиональные управляющие собирают "портфель инвестиций", чтобы снизить риски.
   > **Пояснение:** Вы не знаете, в какие акции лучше вложиться. Вы покупаете пай в ПИФе, и управляющая компания сама решает, куда вложить общие деньги. Если они удачно вложили — вы получаете доход. Если нет — теряете.

3. **Кредитные союзы.** Предоставляют кредиты и принимают вклады, но в отличие от банков не могут открывать счета, выпускать карты, осуществлять переводы. У кредитных союзов обычно ниже проценты по кредитам и выше проценты по вкладам.
   > **Пояснение:** Это объединение людей, которые помогают друг другу деньгами.

4. **Пенсионные фонды.** Похожи на ПИФы, но прибыль от вкладов направляется на увеличение пенсий и социальных выплат.
   > **Пояснение:** Вы (или ваш работодатель) отчисляете деньги в пенсионный фонд. Фонд вкладывает эти деньги в ценные бумаги, получает доход и добавляет его к вашей будущей пенсии.

5. **Страховые организации.** Накапливают деньги от желающих лиц для компенсации при наступлении страхового случая (например, авария или травма). Выплата осуществляется только при наступлении такого случая.

**Участники финансового рынка:**

- **Кредиторы** — физические или юридические лица, предоставляющие кредиты заемщикам.
- **Заемщики** — физические или юридические лица, нуждающиеся в деньгах.
- **Посредники** — институты (банки, фонды, союзы), передающие денежные средства инвесторам и заемщикам.

## Тема: Банковские услуги

**Банк** — это финансово-кредитная организация, которая привлекает и размещает денежные средства, осуществляет расчетные и платежные операции. Банк также оказывает другие финансовые услуги: обмен валют, выпуск карт, хранение ценностей.

Главная функция банка — быть посредником между теми, у кого есть свободные деньги (вкладчики), и теми, кому они нужны (заемщики).

**Двухуровневая банковская система:**

1. **Первый уровень — Центральный банк (ЦБ РФ, Банк России).** Это "главный банк" страны. Он не работает с физическими лицами. Его задачи:
   - выпуск национальной валюты (эмиссия);
   - контроль над коммерческими банками;
   - установление ключевой ставки (процента, под который ЦБ дает деньги коммерческим банкам);
   - обеспечение стабильности финансовой системы.

2. **Второй уровень — Коммерческие банки.** Это привычные нам банки (Сбербанк, ВТБ, Тинькофф и др.). Они работают с физическими и юридическими лицами. Их цель — получение прибыли за счет предоставления услуг.

**Распространенные банковские продукты и услуги:**

**А. Сбережения и накопления.**

**Вклад (банковский депозит)** — деньги, переданные в банк на хранение с целью получения дохода.

**Процентная ставка** — плата банка за пользование вашими деньгами. Выражается в процентах годовых.

> **Пояснение:** Ставка 8% годовых означает, что за год хранения суммы в 1000 руб. вы получите 80 руб. дохода.

**Виды вкладов:**

- **Вклад до востребования** — деньги можно забрать в любой момент. Ставка по нему очень низкая (часто ~0,1%).
- **Срочный вклад** — деньги размещаются на определенный срок (например, 1 год). Досрочное снятие ведет к потере большей части процентов. Ставка значительно выше.
  > **Пояснение:** Банк может использовать ваши деньги для выдачи кредитов только если знает, на какой срок они у него останутся. Поэтому за "долгий" срок он платит больше процентов.

**Депозит vs. Вклад:** Вклад — термин, чаще применяемый к деньгам физических лиц. Депозит — более широкое понятие: это могут быть не только деньги, но и ценные бумаги, драгоценные металлы, размещенные в банке на хранение. Часто эти слова используют как синонимы.

**Б. Кредитование.**

**Кредит (займ)** — деньги, которые банк дает заемщику на определенный срок под проценты за пользование.

**Основные виды кредитов:**

- **Потребительский кредит** — на любые нужды (техника, отпуск, ремонт).
- **Ипотека** — кредит на покупку недвижимости (квартиры, дома). Недвижимость находится в залоге у банка. Если заемщик перестает платить, банк может забрать квартиру.
- **Кредитная карта** — возобновляемый кредитный лимит. Главное отличие — наличие льготного периода, когда можно пользоваться деньгами банка без процентов (обычно 50–120 дней).

## Тема: Домохозяйства и их функции

**Домохозяйство** — это человек или группа людей, живущих вместе, ведущих общее хозяйство и объединяющих доходы для удовлетворения своих потребностей.

### Виды домохозяйств:

- **Частное домохозяйство** — самое привычное: семья (супруги, дети, возможно, бабушки/дедушки) или один человек, живущие в своей квартире/доме и ведущие самостоятельное хозяйство.
- **Коллективное домохозяйство** — группа людей, живущих вместе и подчиняющихся общим правилам и бюджету, но не обязательно связанных кровными узами. Пример: люди в общежитии, интернате, казарме, монастыре.

> **Пояснение:** Главное отличие: частное домохозяйство основано на родственных связях и личном жилье, а коллективное — это группа людей, объединенных общим местом проживания и ведущих общее хозяйство ради общей цели.

### Функции домохозяйств:

- закрепление, накопление и инвестирование общего капитала;
- производство и потребление товаров и услуг.

Домохозяйства главным образом занимаются **потреблением** товаров.

**Потребление** — это пользование товарами и услугами с целью удовлетворения потребностей.

**Потребительские товары** — товары, приобретенные для потребления.

**Виды товаров по характеру потребления:**

- **Краткосрочного пользования** — используются быстро, за несколько раз (напитки, косметика, продукты).
- **Длительного пользования** — служат долго (техника, мебель).

### Источники доходов семьи:

- **Фиксированные** — постоянные доходы (оклад, пенсия, стипендия).
- **Переменные** — непостоянные (прибыль от бизнеса, доходы от ценных бумаг, премии).
- **Разовые** — нерегулярные, одноразовые (выигрыш в лотерею, получение наследства).

### Виды расходов:

**По обязательности:**

- **Обязательные** — еда, одежда, лекарства, ЖКХ (коммунальные платежи). Без них нельзя прожить.
- **Необязательные** — путешествия, косметика, посещение культурных мест. Это то, без чего можно обойтись, но хочется.

**По периодичности:**

- **Ежемесячные** — продукты, сотовая связь.
- **Ежегодные** — налоги на имущество, страховка.
- **Переменные** — бытовая техника (покупается не каждый месяц).

## Тема: Семейный бюджет и финансовое планирование

**Семейный бюджет** — это показатель, который иллюстрирует, как доход семьи распределяется на различные предметы первой необходимости, удобства, предметы роскоши и другие культурные потребности.

**Финансовый план** — это оценка текущих доходов и расходов и прогноз будущих доходов и расходов.

> **Пояснение:** Вы сели и расписали: в этом месяце ожидаем 50 000 руб. доходов, из них 20 000 уйдет на обязательные расходы, 10 000 — на необязательные, 5 000 — в сбережения. Это и есть финансовый план.

**При составлении финансового плана учитываются:**

- интересы как каждого члена семьи, так и семьи в целом;
- страховые услуги на членов семьи;
- пенсионные накопления;
- общие сбережения на момент составления плана;
- уровень инфляции (повышение цен в связи с обесцениванием денег).

> **Пояснение об инфляции:** Раньше буханка хлеба стоила 10 руб., а теперь 50 руб. Деньги те же, а купить на них можно меньше. Это и есть инфляция. При планировании бюджета нужно учитывать, что цены будут расти.

**Рекомендация:** при составлении финансового плана составить список того, что потребуется в краткосрочной (до года), среднесрочной (1–5 лет) и долгосрочной (более 5 лет) перспективе.

**Сбережения** — это финансовые доходы населения, отличительными особенностями которых являются длительный период хранения и накопительный характер.

**Виды сбережений:**

- **Краткосрочные** — накопления целевого назначения (например, откладываем на новый телефон в течение полугода).
- **Долгосрочные** — крупная денежная сумма, предназначенная для приобретения дорогостоящих благ (квартира, машина, образование детей).

## Тема: Роль государства в экономике. Налоги и государственный бюджет

**Зачем экономике государство?**

Государство необходимо экономике как регулятор, который устанавливает "правила игры" и решает проблемы, неподвластные рынку.

> **Пояснение:** Если оставить экономику без контроля, сильные компании могут задавить слабых, установить монополию и задирать цены. Государство не дает этому случиться.

### Экономические функции государства:

1. **Правовое регулирование** — создание законов, защищающих права собственности, права потребителей, регулирующих договоры (Гражданский кодекс, Закон о защите прав потребителей).

2. **Стабилизация экономики** — борьба с инфляцией, безработицей, обеспечение экономического роста (с помощью бюджета и денежной политики).

3. **Производство общественных благ** — товары и услуги, которые невыгодно производить частному бизнесу, но они нужны всем: оборона, дороги, уличное освещение, образование, наука.

   > **Пояснение:** Частная компания не будет строить дорогу между городами, потому что не сможет собрать плату со всех водителей. Это делает государство.

4. **Перераспределение доходов** — социальная поддержка слабых слоев населения через пенсии, пособия, бесплатную медицину и образование, чтобы уменьшить неравенство.

   > **Пояснение:** Государство забирает часть денег у богатых (через налоги) и отдает бедным в виде пенсий и пособий. Это помогает сгладить разрыв между богатыми и бедными.

5. **Поддержание конкурентной среды** — защита конкуренции и борьба с монополиями.

**Монополия** — это ситуация на рынке, когда один производитель (или группа) контролирует производство и продажу товара, не имея конкурентов.

> **Примеры:** железнодорожные перевозки (РЖД), передача электроэнергии.
> **Почему это плохо?** Монополист диктует высокие цены и может не заботиться о качестве.
> **Что делает государство?** Создает антимонопольные законы и органы (ФАС — Федеральная антимонопольная служба), чтобы предотвратить монополизацию рынка.

## Тема: Налоги

**Налог** — это обязательный, индивидуально безвозмездный платеж, взимаемый государством с физических и юридических лиц для финансирования своих функций.

> **Пояснение:** "Обязательный" — платить нужно по закону, отказаться нельзя. "Безвозмездный" — государство не обязано что-то вернуть конкретно вам за ваш налог. Деньги идут на общие нужды: дороги, школы, армию.

### Признаки налога:

- **Обязательность** — уплата налога — обязанность, а не добровольное дело.
- **Безвозмездность** — государство не возвращает вам что-то конкретное за ваш налог.
- **Денежная форма** — налоги платятся деньгами, а не товарами.
- **Целевая направленность** — средства идут на общественные нужды, а не в карман чиновнику.

### Функции налогов:

- **Фискальная (главная)** — пополнение государственного бюджета.
- **Регулирующая** — с помощью налогов государство стимулирует (например, льготы для малого бизнеса) или сдерживает (например, высокие акцизы на сигареты) определенные виды деятельности.
- **Перераспределительная** — собранные налоги перераспределяются на социальные нужды (пенсии, пособия).
- **Контрольная** — через уплату налогов ведется учет доходов граждан и компаний.

### Классификация налогов:

**А. По способу взимания:**

- **Прямые налоги** — взимаются напрямую с дохода или имущества.
  - Примеры: налог на прибыль компаний (20%), НДФЛ (налог на доходы физических лиц — 13% с зарплаты), налог на имущество.
- **Косвенные налоги** — включаются в цену товара и оплачиваются покупателем.
  - Примеры: НДС (налог на добавленную стоимость — обычно 20%, уже включен в цену любого товара), акцизы на бензин, сигареты, алкоголь.

> **Пояснение:** Прямой налог вы видите: из зарплаты вычли 13% — это НДФЛ. Косвенный налог вы не замечаете, но платите: когда вы покупаете шоколадку за 60 руб., часть этих денег — НДС, который магазин перечислит государству.

**Б. По уровню бюджета:**

- **Федеральные** — НДС, налог на прибыль, НДФЛ. Идут в федеральный бюджет.
- **Региональные** — налог на имущество организаций, транспортный налог. Идут в бюджет региона (области, края).
- **Местные** — земельный налог, налог на имущество физических лиц. Идут в бюджет города или района.

**В. По субъекту (кто платит):**

- **Налоги с физических лиц** — НДФЛ (13% с зарплаты), налог на имущество граждан.
- **Налоги с юридических лиц** — налог на прибыль (20%), НДС.

## Тема: Государственный бюджет

**Государственный бюджет** — это сводный план доходов и расходов государства на определенный период (обычно год), имеющий силу закона.

Бюджет утверждается Федеральным Собранием (Государственной Думой и Советом Федерации). За исполнение бюджета отвечает правительство.

**Доходы бюджета** — деньги, поступающие в бюджет.

**Источники:** налоги (основной источник, около 85%), государственные займы (выпуск облигаций), доходы от государственной собственности (например, от продажи нефти и газа).

**Расходы бюджета** — деньги, которые государство тратит на свои функции.

**Направления расходов:**

- Социальные нужды (здравоохранение, образование, пенсии, культура, спорт) — самая большая статья.
- Оборона и безопасность.
- Осуществление управления (содержание органов власти).
- Развитие экономики (поддержка отраслей, строительство дорог).
- Обслуживание государственного долга (выплата процентов по кредитам, которые брало государство).

### Состояние бюджета:

- **Сбалансированный бюджет** — доходы равны расходам. Идеал, но на практике встречается редко.
- **Дефицит бюджета** — доходы меньше расходов. Государству не хватает денег.
  - Пути покрытия дефицита:
    - Внутренние займы у своих корпораций или внешние займы у других стран (ведет к росту государственного долга).
    - **Эмиссия денег** — выпуск новых денег. Может привести к **инфляции** (обесцениванию денег, потому что денег становится больше, а товаров — столько же).
    - Сокращение расходов или повышение налогов.
- **Профицит бюджета** — доходы больше расходов. Встречается реже. Излишек может быть направлен в резервный фонд, на досрочную выплату долгов или на увеличение социальных расходов.

## Тема: Государственная бюджетная и кредитно-денежная политика

Это два главных инструмента, с помощью которых государство управляет экономикой.

### А. Бюджетно-налоговая политика

Влияние на экономику через изменение государственных расходов и налогов.

- **Стимулирующая политика** (когда экономика в кризисе):
  - Увеличение государственных расходов (например, строительство дорог, поддержка заводов) + снижение налогов.
  - Результат: рост спроса и деловой активности.

- **Сдерживающая политика** (когда высокая инфляция):
  - Сокращение расходов + повышение налогов.
  - Результат: снижение спроса и замедление инфляции.

### Б. Кредитно-денежная (монетарная) политика

Влияние на экономику через изменение количества денег в стране и стоимости кредита. Проводит Центральный банк (в России — Банк России).

**Главный инструмент — ключевая ставка.** Это процент, под который Центральный банк дает кредиты коммерческим банкам.

> **Пояснение:** Представьте, что Центральный банк — это "оптовый рынок денег". Он задает цену, по которой продают деньги коммерческим банкам. А коммерческие банки уже перепродают эти деньги нам с вами в виде кредитов.

- **Снижение ключевой ставки:**
  - кредиты для коммерческих банков дешевеют.
  - Банки снижают проценты по кредитам для бизнеса и граждан.
  - Бизнес берет больше кредитов, открывает новые производства.
  - Граждане берет больше кредитов, покупают товары.
  - Экономика растет, но может ускориться инфляция.

- **Повышение ключевой ставки:**
  - кредиты для коммерческих банков дорожают.
  - Банки повышают проценты по кредитам.
  - Брать кредиты становится невыгодно.
  - Спрос падает, цены перестают расти (инфляция снижается).
  - Но страдают малый бизнес (не может взять кредит на развитие) и граждане (становятся недоступны ипотека и потребительские кредиты).

> **Пояснение:** Когда вы слышите в новостях "ЦБ поднял ключевую ставку", это значит, что кредиты станут дороже, а вклады — выгоднее. Цель — сдержать рост цен (инфляцию). Но это больно для экономики: бизнес не развивается, зарплаты растут медленнее.
